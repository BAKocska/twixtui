<!-- Historical three-tier storyboard; current behavior is documented in docs/MANUAL.md. -->
<script>window.OM_SCENES = '[{"name":"Topic1","dur":5.6,"nat":5,"desc":"A shell echoes the first topic, 01 Playing the bot, then clears"},{"name":"Menu","dur":8,"nat":6,"desc":"twixtui is typed; the front menu draws with the 1962 lid in character cells and the cursor walks the entries"},{"name":"Tiers","dur":6.5,"nat":5,"desc":"Play, the computer, and the three bot tiers with their explanations"},{"name":"Game","dur":9,"nat":7,"desc":"A 24x24 game against the pro bot; the bot thinks and plays, the cursor moves"},{"name":"Hint","dur":8.5,"nat":6,"desc":"? asks the engine; the hint panel, labelled illustrative, and the marked holes are shown"},{"name":"Topic2","dur":5.6,"nat":5,"desc":"A shell echoes the second topic, 02 Playing together, then clears"},{"name":"Remote","dur":7,"nat":5,"desc":"A host waits through a relay with a pairing code; a second terminal joins"},{"name":"Topic3","dur":5.6,"nat":5,"desc":"A shell echoes the third topic, 03 Around the board, then clears"},{"name":"Standings","dur":5.5,"nat":4,"desc":"The leaderboard with players and the unranked bots"},{"name":"Themes","dur":7,"nat":5,"desc":"Colours chooser previews the four schemes, then the install line"}]';
