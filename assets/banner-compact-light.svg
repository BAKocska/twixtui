<svg xmlns="http://www.w3.org/2000/svg" width="500" height="470" viewBox="0 0 500 470" role="img" aria-label="twixtui — TwixT in the terminal"><title>twixtui — TwixT in the terminal</title>
<desc>The narrow-screen arrangement of the front-page artwork: the same 1962 TwixT box lid, redrawn flat — stencil TWIXT lettering over a mauve sky, tall red pegs flanking a receding chain of linked black pegs on a golden board of holes — stacked above the shell prompt that runs twixtui, at type sizes a phone can read.</desc>
