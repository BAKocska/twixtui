name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/banner-*.svg"
      - "assets/twixtui-demo.mp4"
      - "assets/demo-poster.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments are a single shared resource; queue them instead of
# cancelling, so an in-flight publish is never left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # The site is web/ plus the repository's own artwork and tour export, so
      # the page shows what the README shows without a second copy in the tree
      # and without fetching anything from another origin.
      - name: Assemble the site
        run: |
          set -eu
          rm -rf _site
          cp -R web _site
          mkdir -p _site/assets
          cp assets/banner-*.svg assets/twixtui-demo.mp4 assets/demo-poster.png _site/assets/
          for f in banner-light.svg banner-dark.svg banner-compact-light.svg banner-compact-dark.svg twixtui-demo.mp4 demo-poster.png; do
            test -s "_site/assets/$f"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
