name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # So the release workflow can run these same checks on a pushed tag before
  # publishing anything built from it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks are separate jobs rather than steps of one job. Steps run in order
# and the first failure ends the run, so while they shared a job a stray tab
# hid every test result and cost a whole push to learn them. Apart, each check
# reports for itself and they all run at once, so the split costs runner time
# -- about eight seconds of setup apiece -- and nothing in wall time.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum

      - name: Vet
        run: go vet ./...

  # Build the actual release archives, without publishing them. Windows jobs
  # execute these ZIPs as well as their source-built binaries, so packaging and
  # release ldflags cannot stay unchecked until a tag is pushed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Keep Windows snapshot archives
        uses: actions/upload-artifact@v4
        with:
          name: windows-snapshot-archives
          path: |
            dist/*_windows_*.zip
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error

  # Unix release targets use tmux; native Windows uses ConPTY below.
  test:
    strategy:
      # Both answers are wanted. Cancelling macOS because Linux failed hides
      # whether a failure is portable, which is the question the matrix exists
      # to answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # setup-go's cache covers the module cache and the build cache, keyed
          # per operating system and Go version, which is what keeps the added
          # jobs cheap. It is also all the caching worth doing here: compiling
          # this module and its dependencies from an empty build cache costs
          # about thirteen processor seconds and a quarter of a second warm, so
          # even a perfect cache could save only a few seconds a run.
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum

      - name: Install tmux
        # Neither runner image ships tmux, and the end-to-end suite drives it as
        # a scriptable terminal.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install tmux
          else
            sudo apt-get update
            sudo apt-get install -y tmux
          fi
          tmux -V

      - name: Test
        shell: bash
        # -count=1 because a run that reports a cached result has not run the
        # tests, and a green tick that means "nothing executed" is the same
        # defect as a suite that skips itself. It costs the bot package's search
        # tests on every push; that is the price of the tick meaning something.
        #
        # -parallel 8 rather than the default of one per core, for the
        # end-to-end tests, which wait on a terminal instead of computing.
        # Measured on two cores that package takes 39s serially and 9s this way.
        #
        # -json so the next step can ask what actually ran. The stream is kept
        # outside the checkout and the human-readable log is reconstructed from
        # it, so nothing is lost from the step's output and nothing is left
        # lying in the working tree. build-output has to be reconstructed
        # alongside output: a package that fails to compile reports the reason
        # only under that action, so filtering on output alone would print
        # "[build failed]" and nothing about why.
        run: |
          go test -count=1 -parallel 8 -json ./... \
            | tee "$RUNNER_TEMP/test.json" \
            | jq -j -r 'select(.Action == "output" or .Action == "build-output") | .Output'

      - name: Prove the end-to-end suite ran
        shell: bash
        # Every test in internal/e2e skips itself when tmux is missing, so
        # before tmux was installed the whole layer reported success while
        # running nothing. That is worse than not having the layer, because the
        # tick claims the terminal behaviour was checked. Installing tmux is
        # only half the fix: nothing about a green step distinguishes twenty-two
        # tests passing from twenty-two skipping. This is the other half.
        #
        # The floor is one rather than a transcribed count, so that adding or
        # removing a test does not silently invalidate the check. On its own a
        # floor would not be enough: one test in the package needs no terminal
        # and passes on a bare runner while the other twenty-one skip. Requiring
        # no skips at all is what closes that.
        run: |
          pkg=github.com/BAKocska/twixtui/internal/e2e
          events="$RUNNER_TEMP/test.json"
          skipped="$(jq -r --arg p "$pkg" \
            'select(.Package == $p and .Action == "skip" and .Test != null) | .Test' "$events" | sort -u)"
          if [ -n "$skipped" ]; then
            echo "::error::the end-to-end suite skipped tests instead of running them" >&2
            echo "$skipped" >&2
            exit 1
          fi
          ran="$(jq -r --arg p "$pkg" \
            'select(.Package == $p and .Action == "pass" and .Test != null) | .Test' "$events" | sort -u | wc -l | tr -d ' ')"
          if [ "$ran" -lt 1 ]; then
            echo "::error::no end-to-end test ran at all; the package produced no results" >&2
            exit 1
          fi
          echo "$ran end-to-end tests ran, none skipped"

  # The race detector, on the packages that start goroutines. netplay is the
  # reason it is here at all: listeners, relays and sessions, and forty separate
  # `go` statements. app, cli, leaderboard and profile each start a handful and
  # come along for about a fifth of a second apiece.
  #
  # bot is deliberately absent although it also starts goroutines. Its tests are
  # calibrated against wall-clock search budgets, and the detector slows the
  # search enough to change what they measure: on a 24x24 board at the
  # measurement budgets the depths reached fall from beginner 1, intermediate 3,
  # pro 4 to 1, 2 and 2, so the tiers stop being distinguishable and a strength
  # number produced under the detector is not the engine's. The Unix terminal
  # harness delegates its PTY to tmux; the concurrent ConPTY implementation is
  # covered separately by the native Windows amd64 race job below.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum

      - name: Race detector
        # Measured at about a third longer than the plain run on these packages,
        # which is cheap enough to belong on every push rather than in a nightly
        # job nobody reads.
        run: |
          go test -race -count=1 ./internal/netplay/ ./internal/app/ ./internal/cli/ \
            ./internal/leaderboard/ ./internal/profile/

  # Native Windows executes the same product scenarios through ConPTY. The
  # script fails if any terminal test skips or if its positive controls did
  # not pass; cross-compilation and WSL cannot satisfy this job.
  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: |
            go.sum
            go.work.sum

      - name: Native tests and mandatory terminal coverage
        shell: pwsh
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows vet failed.' }
          ./.github/scripts/test-windows.ps1 -ExpectedArch '${{ matrix.arch }}'

      - name: Windows input dependency tests
        shell: pwsh
        timeout-minutes: 3
        run: |
          go test -count=1 github.com/charmbracelet/ultraviolet/...
          if ($LASTEXITCODE -ne 0) { throw 'Windows input dependency tests failed.' }

      - name: Prove completion executable identity guard
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          $proof = Join-Path $env:RUNNER_TEMP 'windows-tests/completion-identity-proof'
          $selectedDir = Join-Path $proof 'selected'
          $decoyDir = Join-Path $proof 'decoy'
          New-Item -ItemType Directory -Force $selectedDir, $decoyDir | Out-Null
          $selected = Join-Path $selectedDir 'renamed.exe'
          go build -ldflags '-X main.version=selected' -o $selected ./cmd/twixtui
          if ($LASTEXITCODE -ne 0) { throw 'Selected binary build failed.' }
          go build -ldflags '-X main.version=decoy' -o (Join-Path $decoyDir 'twixtui.exe') ./cmd/twixtui
          if ($LASTEXITCODE -ne 0) { throw 'Decoy binary build failed.' }
          git fetch --no-tags origin 9fe621c463ca35ab151abfd90147ed1d2271527e
          if ($LASTEXITCODE -ne 0) { throw 'Baseline fetch failed.' }
          $original = git show '9fe621c463ca35ab151abfd90147ed1d2271527e:internal/e2e/powershell_windows_test.go'
          if ($LASTEXITCODE -ne 0) { throw 'Baseline source read failed.' }
          $baseline = Join-Path $proof 'baseline_test.go'
          $original | Set-Content -Encoding utf8 $baseline
          $overlay = Join-Path $proof 'overlay.json'
          $replace = @{}
          $replace[(Join-Path $PWD.Path 'internal/e2e/powershell_windows_test.go')] = $baseline
          @{ Replace = $replace } | ConvertTo-Json | Set-Content -Encoding utf8 $overlay
          $env:TWIXTUI_E2E_BINARY = $selected
          $env:PATH = $decoyDir + [IO.Path]::PathSeparator + $env:PATH
          $before = go test -overlay $overlay -count=1 -run '^TestPowerShellCompletesTiersAndProfiles$' -json ./internal/e2e
          $beforeExit = $LASTEXITCODE
          $before | Set-Content -Encoding utf8 (Join-Path $proof 'before.jsonl')
          $beforeEvents = @($before | ForEach-Object { $_ | ConvertFrom-Json })
          if ($beforeExit -ne 0 -or -not ($beforeEvents | Where-Object { $_.Test -eq 'TestPowerShellCompletesTiersAndProfiles' -and $_.Action -eq 'pass' })) {
            throw 'Baseline did not reproduce the false pass against the decoy.'
          }
          $after = go test -count=1 -run '^TestPowerShellCompletesTiersAndProfiles$' -json ./internal/e2e
          $afterExit = $LASTEXITCODE
          $after | Set-Content -Encoding utf8 (Join-Path $proof 'after.jsonl')
          $afterEvents = @($after | ForEach-Object { $_ | ConvertFrom-Json })
          $diagnostic = (($afterEvents | Where-Object { $_.Action -eq 'output' } | ForEach-Object { $_.Output }) -join '') -replace '[\s|]', ''
          if ($afterExit -eq 0 -or -not ($afterEvents | Where-Object { $_.Test -eq 'TestPowerShellCompletesTiersAndProfiles' -and $_.Action -eq 'fail' }) -or -not $diagnostic.Contains('Completionwouldinvokeadifferentexecutablethantheselectedbinary.')) {
            throw 'The fixed test did not reject the selected/decoy mismatch for the intended reason.'
          }
          Write-Host 'Original test falsely passes against the decoy; fixed test rejects the executable mismatch.'
          exit 0

      # Go 1.26 has a Windows race detector for amd64, not arm64. ARM64 runs
      # the native functional/concurrency tests above, never an emulated race job.
      - name: Windows race detector
        if: matrix.arch == 'amd64'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          gcc --version
          if ($LASTEXITCODE -ne 0) { throw 'The Windows race detector requires the runner C compiler.' }
          go test -race -count=1 -timeout 5m ./internal/netplay ./internal/app ./internal/cli ./internal/leaderboard ./internal/profile ./internal/gamestore ./internal/winfs
          if ($LASTEXITCODE -ne 0) { throw 'Windows race tests failed.' }
          go test -race -count=1 -parallel 4 -timeout 5m ./internal/e2e
          if ($LASTEXITCODE -ne 0) { throw 'Windows terminal harness race tests failed.' }

      - name: Download release-format Windows archives
        uses: actions/download-artifact@v4
        with:
          name: windows-snapshot-archives
          path: ${{ runner.temp }}/windows-snapshot-archives

      - name: Verify and drive the packaged binary
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'windows-snapshot-archives'
          $metadata = Get-Content -Raw -LiteralPath (Join-Path $directory 'metadata.json') | ConvertFrom-Json
          $archive = Join-Path $directory "twixtui_$($metadata.version)_windows_$($env:EXPECTED_ARCH).zip"
          ./.github/scripts/test-windows-archive.ps1 -ExpectedArch $env:EXPECTED_ARCH -ExpectedVersion $metadata.version -ExpectedCommit $env:EXPECTED_COMMIT -Archive $archive -Checksums (Join-Path $directory 'checksums.txt')

      - name: Keep native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/windows-tests
            ${{ runner.temp }}/windows-archive-tests
          if-no-files-found: error
