name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: the checks are seconds apiece and share a Go
  # toolchain, so splitting them would cost more in setup than it saves.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Install tmux
        # The end-to-end suite drives a real terminal multiplexer to test
        # resize behaviour, and skips itself when tmux is missing. Installing it
        # explicitly is what stops CI from quietly not running those tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          tmux -V

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...
