name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag is the one ref that must not skip the checks: ci runs on branch
  # pushes and pull requests, and a pushed tag is neither, so before this job
  # existed `git push --tags` published binaries for a tree that nothing had
  # tested. The checks are the same workflow ci runs everywhere else, called
  # rather than copied, so the two cannot drift apart.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from the commit log and the version
          # from the tag, so a shallow clone would produce a wrong release.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Exercise what users download, not a freshly rebuilt substitute. Source CI
  # already ran natively before publication; this checks the actual ZIP,
  # stamped version/commit and terminal workflow on both Windows architectures.
  verify-windows-artifact:
    needs: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Download and verify the published Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "twixtui_${version}_windows_$($env:RELEASE_ARCH).zip"
          $destination = Join-Path $env:RUNNER_TEMP 'published Windows artifact'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $name --pattern checksums.txt --dir $destination
          if ($LASTEXITCODE -ne 0) { throw 'Published artifact download failed.' }
          $archive = Join-Path $destination $name
          $lines = @(Get-Content (Join-Path $destination 'checksums.txt') | Where-Object { ($_ -split '\s+')[-1] -eq $name })
          if ($lines.Count -ne 1) { throw 'Missing or ambiguous published checksum.' }
          $expected = ($lines[0] -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw 'Published archive checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $binary = Join-Path $destination 'twixtui.exe'
          $reported = & $binary version
          if ($LASTEXITCODE -ne 0 -or $reported -notmatch [regex]::Escape("twixtui $version ") -or $reported -notmatch [regex]::Escape($env:EXPECTED_COMMIT)) {
            throw "Published binary has the wrong version/commit: $reported"
          }
          "TWIXTUI_PUBLISHED_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'windows-tests') | Out-Null
          @{ tag = $env:RELEASE_TAG; commit = $env:EXPECTED_COMMIT; archive = $name; sha256 = $actual; version = $reported } |
            ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'windows-tests/artifact.json')

      - name: Drive the downloaded binary natively
        shell: pwsh
        run: |
          ./.github/scripts/test-windows.ps1 -ExpectedArch '${{ matrix.arch }}' -Scope artifact -Binary $env:TWIXTUI_PUBLISHED_BINARY

      - name: Keep artifact execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-tests
          if-no-files-found: error
