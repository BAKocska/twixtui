name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from the commit log and the version
          # from the tag, so a shallow clone would produce a wrong release.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
